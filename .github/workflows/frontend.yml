# GitHub Actions CI for React + TypeScript frontend in monorepo
# Runs on push/PR if files in frontend/ change

name: Frontend CI

on:
    push:
        paths:
            - "frontend/**"
    pull_request:
        paths:
            - "frontend/**"

permissions:
    contents: read

jobs:
    frontend-build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm ci

            - name: Lint with ESLint
              run: npm run lint

            - name: Type check with TypeScript
              run: npx tsc --noEmit
